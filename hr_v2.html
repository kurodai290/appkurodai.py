
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム - 人事労務ルーム</title>
    <style>
        body { background: #121214; color: #e0e0e6; font-family: 'Courier New', Courier, monospace; padding: 20px; line-height: 1.6; }
        h1, h2, h3 { color: #eab308; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .btn-group { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: #eab308; color: #000; border: none; padding: 12px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.1s; }
        button:hover { background: #fde047; }
        .nav-link { background: #22c55e; color: black; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        .sub-text { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
    </style>
    <script>
        let params = new URLSearchParams(window.location.search);
        let cash = params.get('cash') ? parseInt(params.get('cash')) : 2000000;
        let loan = params.get('loan') ? parseInt(params.get('loan')) : 0;
        let deposit = params.get('deposit') ? parseInt(params.get('deposit')) : 0;
        
        let stockPhone = params.get('sphone') ? parseInt(params.get('sphone')) : 0;
        let stockCar = params.get('scar') ? parseInt(params.get('scar')) : 0;
        let stockRobot = params.get('srobot') ? parseInt(params.get('srobot')) : 0;
        let stockRocket = params.get('srocket') ? parseInt(params.get('srocket')) : 0;
        
        let staffSales = params.get('ssales') ? parseInt(params.get('ssales')) : 1;
        let staffEng = params.get('seng') ? parseInt(params.get('seng')) : 0;
        let staffSci = params.get('ssci') ? parseInt(params.get('ssci')) : 0;
        
        let term = params.get('term') ? parseInt(params.get('term')) : 1;
        let newsText = params.get('news') ? params.get('news') : "";
        let priceMultiplier = params.get('mult') ? parseFloat(params.get('mult')) : 1.0;

        function updateUI() {
            document.getElementById("lbl-cash").innerText = cash.toLocaleString();
            document.getElementById("lbl-staff-sales").innerText = staffSales;
            document.getElementById("lbl-staff-eng").innerText = staffEng;
            document.getElementById("lbl-staff-sci").innerText = staffSci;
            
            // 🏢 全て漏らさずデータをCEO室に渡します
            document.getElementById("lnk-to-ceo").href = `ceo_v2.html?cash=${cash}&loan=${loan}&deposit=${deposit}&sphone=${stockPhone}&scar=${stockCar}&srobot=${stockRobot}&srocket=${stockRocket}&ssales=${staffSales}&seng=${staffEng}&ssci=${staffSci}&term=${term}&news=${encodeURIComponent(newsText)}&mult=${priceMultiplier}`;
        }

        function hireSales() { if (cash >= 100000) { cash -= 100000; staffSales++; updateUI(); } else { alert("資金不足です！"); } }
        function hireEng() { if (cash >= 150000) { cash -= 150000; staffEng++; updateUI(); } else { alert("資金不足です！"); } }
        function hireSci() { if (cash >= 500000) { cash -= 500000; staffSci++; updateUI(); } else { alert("資金不足です！"); } }
    </script>
</head>
<body onload="updateUI()">
    <h1>👥 人事労務・専門職採用本部</h1>
    <a id="lnk-to-ceo" class="nav-link" href="ceo_v2.html">🏢 CEO室（総合統括本部）に戻る</a>
    <div class="card" style="background: #111;">
        <h3>📊 労働力スタック状況</h3>
        <p>求人費用キャッシュ: <strong id="lbl-cash">2,000,000</strong> 円</p>
        <p>💼 営業: <strong id="lbl-staff-sales">1</strong> 名 | 🛠️ エンジニア: <strong id="lbl-staff-eng">0</strong> 名 | 🧠 科学者: <strong id="lbl-staff-sci">0</strong> 名</p>
    </div>
    <div class="grid">
        <div class="card">
            <h3>💼 営業スタッフ</h3>
            <span class="sub-text">コスト: 10万円 / 月給: 15万</span>
            <button onclick="hireSales()">営業を採用（連打可）</button>
        </div>
        <div class="card">
            <h3>🛠️ 製造エンジニア</h3>
            <span class="sub-text">コスト: 15万円 / 月給: 25万</span>
            <button onclick="hireEng()">エンジニアを採用（連打可）</button>
        </div>
        <div class="card">
            <h3>🧠 最先端AI科学者</h3>
            <span class="sub-text">コスト: 50万円 / 月給: 60万</span>
            <button onclick="hireSci()">科学者を採用（連打可）</button>
        </div>
    </div>
</body>
</html>
