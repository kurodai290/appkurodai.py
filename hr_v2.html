<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム - 人事労務ルーム</title>
    <style>
        body { background: #121214; color: #e0e0e6; font-family: 'Courier New', Courier, monospace; padding: 20px; line-height: 1.6; }
        h1, h2, h3 { color: #eab308; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        button { background: #eab308; color: #000; border: none; padding: 12px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.1s; width: 100%; }
        button:hover { background: #fde047; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        .nav-link { background: #22c55e; color: black; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        .sub-text { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
        .status-text { font-size: 12px; color: #3b82f6; font-weight: bold; display: block; margin-top: 5px; min-height: 18px; }
    </style>
    <script>
        let gameData = JSON.parse(localStorage.getItem('corp_game_data'));

        // 💡 難易度アップ：スタッフ数が1人増えるごとに求人広告費が25%ずつインフレ
        function getHireCost(baseCost, currentStaff) {
            return Math.floor(baseCost * Math.pow(1.25, currentStaff));
        }

        function updateUI() {
            document.getElementById("lbl-cash").innerText = gameData.cash.toLocaleString();
            document.getElementById("lbl-staff-sales").innerText = gameData.ssales;
            document.getElementById("lbl-staff-eng").innerText = gameData.seng;
            document.getElementById("lbl-staff-sci").innerText = gameData.ssci;

            document.getElementById("cost-sales").innerText = getHireCost(100000, gameData.ssales - 1).toLocaleString();
            document.getElementById("cost-eng").innerText = getHireCost(150000, gameData.seng).toLocaleString();
            document.getElementById("cost-sci").innerText = getHireCost(500000, gameData.ssci).toLocaleString();
            
            localStorage.setItem('corp_game_data', JSON.stringify(gameData));
        }

        function processHiring(btnId, statusId, baseCost, currentCount, buildTime, successCallback) {
            let btn = document.getElementById(btnId);
            let status = document.getElementById(statusId);
            let actualCost = getHireCost(baseCost, currentCount);
            
            if (gameData.cash < actualCost) {
                alert("求人費用が不足しています！");
                return;
            }

            gameData.cash -= actualCost;
            btn.disabled = true;
            updateUI();

            let timeLeft = buildTime;
            status.innerText = `⏳ 選考・研修中... (残り ${timeLeft}秒)`;

            let timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    status.innerText = `⏳ 選考・研修中... (残り ${timeLeft}秒)`;
                } else {
                    clearInterval(timer);
                    status.innerText = "🎉 採用・配属完了！";
                    successCallback();
                    btn.disabled = false;
                    updateUI();
                    setTimeout(() => { if(status.innerText === "🎉 採用・配属完了！") status.innerText = ""; }, 2000);
                }
            }, 1000);
        }

        function hireSales() { processHiring("btn-sales", "status-sales", 100000, gameData.ssales - 1, 3, () => { gameData.ssales++; }); }
        function hireEng() { processHiring("btn-eng", "status-eng", 150000, gameData.seng, 5, () => { gameData.seng++; }); }
        function hireSci() { processHiring("btn-sci", "status-sci", 500000, gameData.ssci, 10, () => { gameData.ssci++; }); }
    </script>
</head>
<body onload="updateUI()">
    <h1>👥 人事労務・専門職採用本部</h1>
    <a class="nav-link" href="index.html">🏢 CEO室（総合統括本部）に戻る</a>
    
    <div class="card" style="background: #111;">
        <h3>📊 労働力スタック状況</h3>
        <p>求人費用キャッシュ: <strong id="lbl-cash">0</strong> 円</p>
        <p>💼 営業: <strong id="lbl-staff-sales">1</strong> 名 | 🛠️ エンジニア: <strong id="lbl-staff-eng">0</strong> 名 | 🧠 科学者: <strong id="lbl-staff-sci">0</strong> 名</p>
    </div>
    
    <div class="grid">
        <div class="card">
            <h3>💼 営業スタッフ</h3>
            <span class="sub-text">コスト: <strong id="cost-sales">0</strong> 円 / 月給: 15万 | ⏳ 選考: 3秒</span>
            <button id="btn-sales" onclick="hireSales()">営業を採用</button>
            <div id="status-sales" class="status-text"></div>
        </div>
        <div class="card">
            <h3>🛠️ 製造エンジニア</h3>
            <span class="sub-text">コスト: <strong id="cost-eng">0</strong> 円 / 月給: 25万 | ⏳ 選考: 5秒</span>
            <button id="btn-eng" onclick="hireEng()">エンジニアを採用</button>
            <div id="status-eng" class="status-text"></div>
        </div>
        <div class="card">
            <h3>🧠 最先端AI科学者</h3>
            <span class="sub-text">コスト: <strong id="cost-sci">0</strong> 円 / 月給: 60万 | ⏳ 選考: 10秒</span>
            <button id="btn-sci" onclick="hireSci()">科学者を採用</button>
            <div id="status-sci" class="status-text"></div>
        </div>
    </div>
</body>
</html>
