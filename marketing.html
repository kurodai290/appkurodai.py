<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム - マーケティング広告部</title>
    <style>
        body { background: #121214; color: #e0e0e6; font-family: 'Courier New', Courier, monospace; padding: 20px; line-height: 1.6; }
        h1, h2, h3 { color: #ec4899; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; border-radius: 5px; }
        button { background: #ec4899; color: #fff; border: none; padding: 12px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.1s; width: 100%; }
        button:hover { background: #f472b6; }
        .nav-link { background: #22c55e; color: black; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        .sub-text { font-size: 11px; color: #aaa; display: block; margin-top: 2px; }
    </style>
    <script>
        let gameData;
        function loadData() {
            try {
                gameData = JSON.parse(localStorage.getItem('corp_game_data'));
                if (!gameData) throw new Error();
            } catch(e) {
                window.location.href = "index.html";
            }
        }

        function updateUI() {
            document.getElementById("lbl-cash").innerText = gameData.cash.toLocaleString();
            document.getElementById("lbl-marketing").innerText = gameData.marketing;
            
            // 💾 データをブラウザへ確実に即時セーブ
            localStorage.setItem('corp_game_data', JSON.stringify(gameData));
        }

        function runCampaign(cost, effect) {
            if (gameData.cash < cost) { alert("広告予算が足りません！"); return; }
            gameData.cash -= cost;
            gameData.marketing = Math.min(100, gameData.marketing + effect);
            alert(`キャンペーン成功！市場認知度が ${effect}% 向上しました。`);
            updateUI();
        }
        function initPage() { loadData(); updateUI(); }
    </script>
</head>
<body onload="initPage()">
    <h1>📢 マーケティング・市場広告統括部</h1>
    <a class="nav-link" href="index.html">🏢 CEO室に戻る</a>
    <div class="card" style="margin-bottom: 20px; background: #111;">
        <h3>📊 現在の市場ステータス</h3>
        <p>利用可能キャッシュ: <strong id="lbl-cash">0</strong> 円</p>
        <p>現在のブランド認知度: <strong id="lbl-marketing" style="color:#ec4899; font-size:18px;">20</strong> %</p>
    </div>
    <div class="grid">
        <div class="card">
            <h2>📱 SNSバイラルマーケティング</h2>
            <span class="sub-text">費用: 15万円 | 📈 認知度: +8%</span><br>
            <button onclick="runCampaign(150000, 8)">SNS広告を打つ</button>
        </div>
        <div class="card">
            <h2>📺 全国マスメディアTVCM枠</h2>
            <span class="sub-text">費用: 100万円 | 📈 認知度: +35%</span><br>
            <button onclick="runCampaign(1000000, 35)">テレビCMを放映する</button>
        </div>
    </div>
</body>
</html>
