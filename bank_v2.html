<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム - 銀行窓口</title>
    <style>
        body { background: #121214; color: #e0e0e6; font-family: monospace; padding: 20px; line-height: 1.6; }
        h1, h2, h3 { color: #3b82f6; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; border-radius: 5px; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: #3b82f6; color: #fff; border: none; padding: 12px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #60a5fa; }
        button.purple { background: #8b5cf6; }
        button.purple:hover { background: #a78bfa; }
        .nav-link { background: #22c55e; color: black; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        .nav-link:hover { background: #4ade80; }
        .sub-text { font-size: 11px; color: #888; display: block; margin-top: 2px; }
    </style>
    <script>
        // 📥 CEO室から引き継いだURLデータを読み込む
        let params = new URLSearchParams(window.location.search);
        let cash = params.get('cash') ? parseInt(params.get('cash')) : 2000000;
        let loan = params.get('loan') ? parseInt(params.get('loan')) : 0;
        let deposit = params.get('deposit') ? parseInt(params.get('deposit')) : 0;
        let stockPhone = params.get('sPhone') ? parseInt(params.get('sPhone')) : 0;
        let stockCar = params.get('sCar') ? parseInt(params.get('sCar')) : 0;
        let staff = params.get('staff') ? parseInt(params.get('staff')) : 1;
        let term = params.get('term') ? parseInt(params.get('term')) : 1;
        let newsText = params.get('news') ? params.get('news') : "";
        let priceMultiplier = params.get('mult') ? parseFloat(params.get('mult')) : 1.0;

        function updateUI() {
            // 画面の数字を最新化
            document.getElementById("lbl-cash").innerText = cash.toLocaleString();
            document.getElementById("lbl-loan").innerText = loan.toLocaleString();
            document.getElementById("lbl-deposit").innerText = deposit.toLocaleString();
            
            // 🏢 CEO室へ戻るリンクのURLに、最新の資金データを上書きする
            document.getElementById("lnk-to-ceo").href = `index_v2.html?cash=${cash}&loan=${loan}&deposit=${deposit}&sPhone=${stockPhone}&sCar=${stockCar}&staff=${staff}&term=${term}&news=${encodeURIComponent(newsText)}&mult=${priceMultiplier}`;
        }

        // 🏦 銀行コマンド：融資を受ける
        function takeLoan() {
            loan += 1000000; // 借金100万追加
            cash += 1000000; // 現金100万追加
            updateUI();
        }

        // 🏦 銀行コマンド：融資を返済する
        function repayLoan() {
            if (loan >= 1000000) {
                if (cash >= 1000000) {
                    loan -= 1000000;
                    cash -= 1000000;
                    updateUI();
                } else { alert("返済するための現金100万円が手元にありません！"); }
            } else { alert("返す借金（ローン残高）がありません。"); }
        }

        // 🏦 銀行コマンド：定期預金に入れる
        function addDeposit() {
            if (cash >= 1000000) {
                cash -= 1000000;
                deposit += 1000000;
                updateUI();
            } else { alert("定期預金に預けるための現金100万円が足りません！"); }
        }

        // 🏦 銀行コマンド：定期預金から引き出す
        function withdrawDeposit() {
            if (deposit >= 1000000) {
                deposit -= 1000000;
                cash += 1000000;
                updateUI();
            } else { alert("定期預金口座に引き出せる残高がありません！"); }
        }
    </script>
</head>
<body onload="updateUI()">

    <h1>🏦 中央第一銀行（財務営業窓口）</h1>
    
    <!-- 📄 CEO室へすべてのデータを持って戻るリンクボタン -->
    <a id="lnk-to-ceo" class="nav-link" href="ceo_v2.html">🏢 CEO室（総合統括本部）に戻る</a>

    <!-- 現在のキャッシュ残高の確認枠 -->
    <div class="card" style="margin-bottom: 20px; background: #111;">
        <h3>💰 御社の現在の資金・口座状況</h3>
        <p>手元にある現金 (Cash): <strong id="lbl-cash" style="color:#00ff66; font-size:18px;">2,000,000</strong> 円</p>
    </div>

    <div class="grid">
        <!-- 融資（借金）の管理カード -->
        <div class="card">
            <h2>⚙️ デット・ファイナンス（銀行融資窓口）</h2>
            <p>融資を受けて事業規模を急拡大させることができます。</p>
            <p>現在の借入残高: <strong id="lbl-loan" style="color:#ff3333;">0</strong> 円</p>
            <span class="sub-text" style="color:#aaa;">※毎月の決算時に、借入残高に対して0.5%の利息が自動で引き落とされます。</span>
            <div class="btn-group">
                <button onclick="takeLoan()">銀行から100万円借りる</button>
                <button onclick="repayLoan()">借入金を100万円返済する</button>
            </div>
        </div>

        <!-- 資産運用（定期預金）の管理カード -->
        <div class="card">
            <h2>⚙️ 資産運用・アセットマネジメント（定期預金）</h2>
            <p>余った現金を安全に運用し、不労所得（利息）を得られます。</p>
            <p>現在の預金残高: <strong id="lbl-deposit" style="color:#3b82f6;">0</strong> 円</p>
            <span class="sub-text" style="color:#aaa;">※毎月の決算時に、預金残高に対して0.2%の受取利息が自動で手元に入ります。</span>
            <div class="btn-group">
                <button onclick="addDeposit()" class="purple">定期預金に100万円預ける</button>
                <button onclick="withdrawDeposit()" class="purple">預金から100万円引き出す</button>
            </div>
        </div>
    </div>

</body>
</html>
