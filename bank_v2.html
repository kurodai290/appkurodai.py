<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム - 銀行窓口</title>
    <style>
        body { background: #121214; color: #e0e0e6; font-family: monospace; padding: 20px; line-height: 1.6; }
        h1, h2, h3 { color: #3b82f6; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; border-radius: 5px; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: #3b82f6; color: #fff; border: none; padding: 12px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #60a5fa; }
        button.purple { background: #8b5cf6; }
        button.purple:hover { background: #a78bfa; }
        .nav-link { background: #22c55e; color: black; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        .sub-text { font-size: 11px; color: #888; display: block; margin-top: 2px; }
    </style>
    <script>
        // 💾 ローカルストレージからゲームデータを読み込む（URLパラメータを廃止し不具合修正）
        let gameData = JSON.parse(localStorage.getItem('corp_game_data'));

        function updateUI() {
            document.getElementById("lbl-cash").innerText = gameData.cash.toLocaleString();
            document.getElementById("lbl-loan").innerText = gameData.loan.toLocaleString();
            document.getElementById("lbl-deposit").innerText = gameData.deposit.toLocaleString();
            // データを保存
            localStorage.setItem('corp_game_data', JSON.stringify(gameData));
        }

        function takeLoan() {
            // 💡 難易度アップ：手元現線の2倍までしか融資を受けられないリアルな制限を追加
            let maxLoan = gameData.cash * 2;
            if (gameData.loan >= maxLoan) {
                alert("銀行の与信審査に落ちました。これ以上の融資は受けられません（融資限度額オーバー）。");
                return;
            }
            gameData.loan += 1000000;
            gameData.cash += 1000000;
            updateUI();
        }

        function repayLoan() {
            if (gameData.loan >= 1000000) {
                if (gameData.cash >= 1000000) {
                    gameData.loan -= 1000000;
                    gameData.cash -= 1000000;
                    updateUI();
                } else { alert("返済資金（現金100万円）が手元にありません！"); }
            } else { alert("返済が必要な借入残高がありません。"); }
        }

        function addDeposit() {
            if (gameData.cash >= 1000000) {
                gameData.cash -= 1000000;
                gameData.deposit += 1000000;
                updateUI();
            } else { alert("定期預金に回すための現金100万円が足りません！"); }
        }

        function withdrawDeposit() {
            if (gameData.deposit >= 1000000) {
                gameData.deposit -= 1000000;
                // 💡 難易度アップ：いつでも等価で引き出せた不具合を修正し、中途解約ペナルティ（5万円）を導入
                gameData.cash += 950000;
                alert("定期預金を中途解約したため、手数料50,000円が差し引かれました。");
                updateUI();
            } else { alert("定期預金口座に解約可能な残高がありません！"); }
        }
    </script>
</head>
<body onload="updateUI()">
    <h1>🏦 中央第一銀行（財務営業窓口）</h1>
    <a class="nav-link" href="index.html">🏢 CEO室（総合統括本部）に戻る</a>

    <div class="card" style="margin-bottom: 20px; background: #111;">
        <h3>💰 自社の財務口座状況</h3>
        <p>手元にある現金 (Cash): <strong id="lbl-cash" style="color:#00ff66; font-size:18px;">0</strong> 円</p>
    </div>

    <div class="grid">
        <!-- 融資管理カード -->
        <div class="card">
            <h2>⚙️ デット・ファイナンス（銀行融資審査窓口）</h2>
            <p>現在の借入残高: <strong id="lbl-loan" style="color:#ff3333;">0</strong> 円</p>
            <span class="sub-text" style="color:#aaa;">※毎月0.5%の金利利息が自動で引き落とされます。現在の融資上限は手元現金の2倍までです。</span>
            <div class="btn-group">
                <button onclick="takeLoan()">銀行から100万円借りる</button>
                <button onclick="repayLoan()">借入金を100万円返済する</button>
            </div>
        </div>

        <!-- 資産運用カード -->
        <div class="card">
            <h2>⚙️ アセットマネジメント（定期預金）</h2>
            <p>現在の預金残高: <strong id="lbl-deposit" style="color:#3b82f6;">0</strong> 円</p>
            <span class="sub-text" style="color:#aaa;">※毎月0.2%の受取利息が入ります。ただし引き出し（中途解約）時は5万円の手数料がかかります。</span>
            <div class="btn-group">
                <button onclick="addDeposit()" class="purple">定期預金に100万円預ける</button>
                <button onclick="withdrawDeposit()" class="purple">預金から100万円引き出す</button>
            </div>
        </div>
    </div>
</body>
</html>
