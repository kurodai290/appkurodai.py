<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム</title>
    <style>
        body { background: #121214; color: #e0e0e6; font-family: monospace; padding: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .btn { background: #3b82f6; color: #fff; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; margin-right: 5px; text-decoration: none; display: inline-block; }
        .next { background: #ef4444; width: 100%; font-weight: bold; margin-bottom: 10px; }
        .skip { background: #10b981; }
    </style>
    <script>
        let d;
        function load() {
            try {
                d = JSON.parse(localStorage.getItem('corp_game_data'));
                if (!d || !('tech_car' in d)) throw new Error();
            } catch (e) {
                d = { cash: 2000000, loan: 0, deposit: 0, sphone: 0, scar: 0, srobot: 0, srocket: 0, ssales: 1, seng: 0, ssci: 0, term: 1, news: "安定しています。", mult_c: 1.0, mult_t: 1.0, marketing: 20, tech_car: false, tech_robot: false, tech_rocket: false };
                save();
            }
        }
        function save() { localStorage.setItem('corp_game_data', JSON.stringify(d)); }
        function set(id, val) { let el = document.getElementById(id); if (el) el.innerText = val; }
        function view() {
            set("t", d.term); set("c", d.cash.toLocaleString()); set("l", d.loan.toLocaleString()); set("dp", d.deposit.toLocaleString());
            set("ss", d.ssales); set("se", d.seng); set("sc", d.ssci); set("sp", d.sphone); set("sr", d.scar); set("sb", d.srobot); set("sk", d.srocket);
            set("m", d.marketing); set("n", d.news);
        }
        function reset() { localStorage.removeItem('corp_game_data'); window.location.reload(); }
        
        function skip(m) {
            for (let i = 0; i < m; i++) {
                let cap = Math.ceil((d.ssales * 3) * (d.marketing / 100));
                let items = [{k:'srocket',p:45000000,m:'mult_t'}, {k:'srobot',p:10000000,m:'mult_t'}, {k:'scar',p:2500000,m:'mult_c'}, {k:'sphone',p:70000,m:'mult_c'}];
                items.forEach(it => {
                    let s = Math.min(d[it.k], cap);
                    d[it.k] -= s; cap -= s; d.cash += Math.round(it.p * d[it.m]) * s;
                });
                d.cash -= (d.sphone * 5000 + d.scar * 50000 + d.srobot * 150000 + d.srocket * 500000);
                d.cash -= (150000 + d.ssales * 150000 + d.seng * 250000 + d.ssci * 600000);
                d.cash = d.cash - Math.round(d.loan * 0.005) + Math.round(d.deposit * 0.002);
                d.marketing = Math.max(5, d.marketing - 5);
                
                if (d.cash < 0 && d.deposit > 0) { let b = Math.min(d.deposit, Math.ceil(Math.abs(d.cash)/1000000)*1000000); d.deposit -= b; d.cash += b; }
                if (d.cash < 0) { alert("破産しました。"); reset(); return; }
                if (d.cash >= 100000000) { alert("1億円達成！クリア！"); reset(); return; }
                if (d.term >= 24) { alert("24ヶ月終了。ゲームオーバー"); reset(); return; }
                
                let r = Math.random();
                if (r < 0.2) { d.news = "【バブル】ロボ・ロケ売価1.5倍！"; d.mult_c = 1.0; d.mult_t = 1.5; }
                else if (r < 0.4) { d.news = "【不況】全売価が0.5倍に暴落！"; d.mult_c = 0.5; d.mult_t = 0.5; }
                else { d.news = "市場は安定しています。"; d.mult_c = 1.0; d.mult_t = 1.0; }
                d.term++;
            }
            view(); save();
        }
    </script>
</head>
<body onload="load(); view();">

    <h2>👔 CEO総合統括本部 (v3 Light)</h2>
    <div class="card" style="background:#1e3a8a;">🎯 MISSION: 24ヶ月以内に1億円を達成せよ</div>
    <div class="card" style="background:#ffea00; color:#000;">📢 景気: <span id="n">読み込み中...</span></div>

    <h3>📂 部署移動リンク</h3>
    <div class="card">
        <a class="btn" href="bank_v2.html" style="background:#3b82f6;">🏦 銀行</a>
        <a class="btn" href="business_v2.html" style="background:#a855f7;">🏭 製造</a>
        <a class="nav-btn btn" href="hr_v2.html" style="background:#eab308; color:#000;">👥 人事</a>
        <a class="btn" href="marketing.html" style="background:#ec4899;">📢 広告</a>
        <a class="btn" href="rnd.html" style="background:#06b6d4;">🧠 研究</a>
    </div>

    <div class="card">
        <h3>📊 財務諸表</h3>
        <p>経営期間: <span id="t">1</span> / 24 ヶ月目</p>
        <p>手元現金: <span id="c" style="color:#00ff66; font-weight:bold;">0</span> 円</p>
        <p>借入金: <span id="l" style="color:#ff3333;">0</span> 円 | 定期預金: <span id="dp" style="color:#3b82f6;">0</span> 円</p>
        <p>認知度: <span id="m">20</span> %</p>
        <br>
        <button class="btn next" onclick="skip(1)">⏭️ 1ヶ月進める（決算実行）</button>
        <button class="btn skip" onclick="skip(3)">⏩ 3ヶ月スキップ</button>
        <button class="btn skip" onclick="skip(6)">⏩ 6ヶ月スキップ</button>
    </div>

    <div class="card">
        <h3>📦 倉庫・人員</h3>
        <p>💼 営業:<span id="ss">1</span>名 | 🛠️ 技術:<span id="se">0</span>名 | 🧠 科学:<span id="sc">0</span>名</p>
        <p>📱 スマホ:<span id="sp">0</span> | 🚗 EV:<span id="sr">0</span> | 🤖 ロボ:<span id="sb">0</span> | 🚀 ロケ:<span id="sk">0</span></p>
        <br>
        <button onclick="reset()" style="background:#555; color:#fff; border:none; padding:5px; cursor:pointer; font-size:11px; width:100%;">⚠️ データを初期化する</button>
    </div>

</body>
</html>
