<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム - CEO室</title>
    <style>
        body { background: #121214; color: #e0e0e6; font-family: 'Courier New', Courier, monospace; padding: 20px; line-height: 1.6; }
        h1, h2, h3 { color: #00ff66; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; border-radius: 5px; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { color: white; padding: 12px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; font-size: 14px; text-align: center; }
        .btn-bank { background: #3b82f6; }
        .btn-business { background: #a855f7; }
        .btn-hr { background: #eab308; color: #000; }
        .btn-marketing { background: #ec4899; }
        .btn-rnd { background: #06b6d4; }
        button.danger { background: #ef4444; color: #fff; border: none; padding: 15px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button.danger:hover { background: #f87171; }
        .log-box { background: #000; color: #00ff66; padding: 10px; height: 150px; overflow-y: scroll; font-size: 13px; border: 1px solid #333; margin-top: 10px; }
        .news-box { background: #ffea00; color: #000; padding: 12px; border-radius: 4px; font-weight: bold; margin-bottom: 20px; border-left: 5px solid #ffaa00; font-size: 15px; }
        .mission-box { background: #1e3a8a; color: #fff; padding: 10px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; border-left: 5px solid #3b82f6; }
    </style>
    <script>
        let gameData;
        
        function loadData() {
            let rawData = localStorage.getItem('corp_game_data');
            try {
                gameData = JSON.parse(rawData);
                if (!gameData || typeof gameData !== 'object' || !('tech_car' in gameData)) {
                    throw new Error("Reset");
                }
            } catch (e) {
                gameData = {
                    cash: 2000000, loan: 0, deposit: 0,
                    sphone: 0, scar: 0, srobot: 0, srocket: 0,
                    ssales: 1, seng: 0, ssci: 0,
                    term: 1, news: "安定した経済環境です。各部門を開拓しましょう！",
                    mult_c: 1.0, mult_t: 1.0,
                    marketing: 20,
                    tech_car: false, tech_robot: false, tech_rocket: false
                };
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('corp_game_data', JSON.stringify(gameData));
        }

        // 💡 エラー対策：HTML内にタグが存在するか1つずつ安全に確認して書き込む
        function safeSetText(id, value) {
            let element = document.getElementById(id);
            if (element) {
                element.innerText = value;
            }
        }

        function updateUI() {
            safeSetText("lbl-term", gameData.term);
            safeSetText("lbl-cash", gameData.cash.toLocaleString());
            safeSetText("lbl-loan", gameData.loan.toLocaleString());
            safeSetText("lbl-deposit", gameData.deposit.toLocaleString());
            safeSetText("lbl-staff-sales", gameData.ssales);
            safeSetText("lbl-staff-eng", gameData.seng);
            safeSetText("lbl-staff-sci", gameData.ssci);
            safeSetText("lbl-stock-phone", gameData.sphone);
            safeSetText("lbl-stock-car", gameData.scar);
            safeSetText("lbl-stock-robot", gameData.srobot);
            safeSetText("lbl-stock-rocket", gameData.srocket);
            safeSetText("lbl-marketing", gameData.marketing);
            safeSetText("news-display", gameData.news);
        }

        function logAction(text) {
            let logBox = document.getElementById("log");
            if (logBox) { logBox.innerHTML += "<br>" + text; logBox.scrollTop = logBox.scrollHeight; }
        }

        function resetGame() {
            localStorage.removeItem('corp_game_data');
            window.location.reload();
        }

        function initPage() {
            loadData();
            updateUI();
        }

        function nextMonth() {
            logAction(`--- 【${gameData.term}ヶ月目 月次決算報告】 ---`);
            
            let maxSales = gameData.ssales * 3;
            let salesCapacity = Math.ceil(maxSales * (gameData.marketing / 100));
            logAction(`[営業部] ブランド認知度(${gameData.marketing}%)により、今月の有効販売枠は ${salesCapacity} 個に制限されました（最大能力: ${maxSales}）`);

            let multHighTech = gameData.mult_t;
            let multStandard = gameData.mult_c;

            if (gameData.srocket > 0) {
                let sell = Math.min(gameData.srocket, salesCapacity); let p = Math.round(45000000 * multHighTech);
                gameData.srocket -= sell; salesCapacity -= sell; gameData.cash += (p * sell);
                if(sell > 0) logAction(`[営業] ロケットが ${sell} 機売却。売上: +${(p * sell).toLocaleString()}円`);
            }
            if (gameData.srobot > 0) {
                let sell = Math.min(gameData.srobot, salesCapacity); let p = Math.round(10000000 * multHighTech);
                gameData.srobot -= sell; salesCapacity -= sell; gameData.cash += (p * sell);
                if(sell > 0) logAction(`[営業] AIロボットが ${sell} 台売却。売上: +${(p * sell).toLocaleString()}円`);
            }
            if (gameData.scar > 0) {
                let sell = Math.min(gameData.scar, salesCapacity); let p = Math.round(2500000 * multStandard);
                gameData.scar -= sell; salesCapacity -= sell; gameData.cash += (p * sell);
                if(sell > 0) logAction(`[営業] 電気自動車が ${sell} 台売却。売上: +${(p * sell).toLocaleString()}円`);
            }
            if (gameData.sphone > 0) {
                let sell = Math.min(gameData.sphone, salesCapacity); let p = Math.round(70000 * multStandard);
                gameData.sphone -= sell; salesCapacity -= sell; gameData.cash += (p * sell);
                if(sell > 0) logAction(`[営業] スマホが ${sell} 台売却。売上: +${(p * sell).toLocaleString()}円`);
            }

            let storageCost = (gameData.sphone * 5000) + (gameData.scar * 50000) + (gameData.srobot * 150000) + (gameData.srocket * 500000);
            if (storageCost > 0) {
                gameData.cash -= storageCost;
                logAction(`[倉庫] 売れ残り在庫の維持管理コストが発生: -${storageCost.toLocaleString()}円`);
            }

            let costRent = 150000;
            let costSales = gameData.ssales * 150000;
            let costEng = gameData.seng * 250000;
            let costSci = gameData.ssci * 600000;
            let totalExpenses = costRent + costSales + costEng + costSci;
            gameData.cash -= totalExpenses;
            logAction(`[財務] 固定費引落（家賃＋人件費）: 計 -${totalExpenses.toLocaleString()}円`);

            gameData.cash = gameData.cash - Math.round(gameData.loan * 0.005) + Math.round(gameData.deposit * 0.002);
            gameData.marketing = Math.max(5, gameData.marketing - 5);

            if (gameData.cash < 0 && gameData.deposit > 0) {
                let deficit = Math.abs(gameData.cash);
                let brokenDeposit = Math.min(gameData.deposit, Math.ceil(deficit / 1000000) * 1000000);
                gameData.deposit -= brokenDeposit;
                gameData.cash += brokenDeposit;
                logAction(`[警告] 現金枯渇！定期預金から ${brokenDeposit.toLocaleString()} 円が強制解約されました。`);
            }
            
            if (gameData.cash < 0) {
                alert("キャッシュが底をつき、倒産しました。ゲームオーバーです。");
                resetGame();
                return;
            }
            if (gameData.cash >= 100000000) {
                alert(`🎉 おめでとうございます！ゲームクリアです！`);
                resetGame();
                return;
            }
            if (gameData.term >= 24) {
                alert(`⏳ タイムアップ！ゲームオーバーです。`);
                resetGame();
                return;
            }

            let rand = Math.random();
            if (rand < 0.20) { 
                gameData.news = "【テクノロジー大バブル到来！】ロボットとロケットの売価が【1.5倍】に高騰中！"; 
                gameData.mult_c = 1.0; gameData.mult_t = 1.5;
            } else if (rand < 0.40) { 
                gameData.news = "【世界同時不況の波】市場崩壊により全製品の売価が【半分(0.5倍)】に大暴落！"; 
                gameData.mult_c = 0.5; gameData.mult_t = 0.5;
            } else if (rand < 0.60) { 
                gameData.news = "【新興国の猛追】安価なスマホ・EVが流入！スマホと自動車の価値が【0.3倍】にダウン！"; 
                gameData.mult_c = 0.3; gameData.mult_t = 1.2;
            } else { 
                gameData.news = "特記すべき経済変動はありません。市場は安定しています。"; 
                gameData.mult_c = 1.0; gameData.mult_t = 1.0;
            }

            gameData.term++;
            saveData();
            updateUI();
        }
    </script>
</head>
