<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム - CEO室</title>
    <style>
        body { background: #121214 !important; color: #e0e0e6 !important; font-family: 'Courier New', Courier, monospace; padding: 20px; line-height: 1.6; display: block !important; visibility: visible !important; }
        h1, h2, h3 { color: #00ff66; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #1a1a24; border: 1px solid #2d2d3d; padding: 15px; border-radius: 5px; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { color: white; padding: 12px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; font-size: 14px; text-align: center; }
        .btn-bank { background: #3b82f6; }
        .btn-business { background: #a855f7; }
        .btn-hr { background: #eab308; color: #000; }
        .btn-marketing { background: #ec4899; }
        .btn-rnd { background: #06b6d4; }
        button.danger { background: #ef4444; color: #fff; border: none; padding: 15px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; transition: 0.1s; }
        button.danger:hover { background: #f87171; }
        /* 💡 新しいスキップボタンのスタイル */
        button.skip-btn { background: #10b981; color: #fff; border: none; padding: 12px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px; flex: 1; transition: 0.1s; }
        button.skip-btn:hover { background: #34d399; }
        .log-box { background: #000; color: #00ff66; padding: 10px; height: 180px; overflow-y: scroll; font-size: 13px; border: 1px solid #333; margin-top: 10px; }
        .news-box { background: #ffea00; color: #000; padding: 12px; border-radius: 4px; font-weight: bold; margin-bottom: 20px; border-left: 5px solid #ffaa00; font-size: 15px; }
        .mission-box { background: #1e3a8a; color: #fff; padding: 10px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; border-left: 5px solid #3b82f6; }
    </style>
    <script>
        let gameData;
        let isGameOver = false; // 連続処理中のストッパー
        
        function loadData() {
            let rawData = localStorage.getItem('corp_game_data');
            try {
                gameData = JSON.parse(rawData);
                if (!gameData || typeof gameData !== 'object' || !('tech_car' in gameData)) {
                    throw new Error("Reset");
                }
            } catch (e) {
                gameData = {
                    cash: 2000000, loan: 0, deposit: 0,
                    sphone: 0, scar: 0, srobot: 0, srocket: 0,
                    ssales: 1, seng: 0, ssci: 0,
                    term: 1, news: "安定した経済環境です。各部門を開拓しましょう！",
                    mult_c: 1.0, mult_t: 1.0,
                    marketing: 20,
                    tech_car: false, tech_robot: false, tech_rocket: false
                };
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('corp_game_data', JSON.stringify(gameData));
        }

        function safeSetText(id, value) {
            let element = document.getElementById(id);
            if (element) { element.innerText = value; }
        }

        function updateUI() {
            safeSetText("lbl-term", gameData.term);
            safeSetText("lbl-cash", gameData.cash.toLocaleString());
            safeSetText("lbl-loan", gameData.loan.toLocaleString());
            safeSetText("lbl-deposit", gameData.deposit.toLocaleString());
            safeSetText("lbl-staff-sales", gameData.ssales);
            safeSetText("lbl-staff-eng", gameData.seng);
            safeSetText("lbl-staff-sci", gameData.ssci);
            safeSetText("lbl-stock-phone", gameData.sphone);
            safeSetText("lbl-stock-car", gameData.scar);
            safeSetText("lbl-stock-robot", gameData.srobot);
            safeSetText("lbl-stock-rocket", gameData.srocket);
            safeSetText("lbl-marketing", gameData.marketing);
            safeSetText("news-display", gameData.news);
        }

        function logAction(text) {
            let logBox = document.getElementById("log");
            if (logBox) { logBox.innerHTML += "<br>" + text; logBox.scrollTop = logBox.scrollHeight; }
        }

        function resetGame() {
            localStorage.removeItem('corp_game_data');
            window.location.reload();
        }

        function initPage() {
            loadData();
            updateUI();
        }

        // 💡 任意の位置まで月数をまとめてスキップする関数
        function skipMonths(monthsToSkip) {
            isGameOver = false;
            logAction(`🔮 <strong>【システム】 ${monthsToSkip}ヶ月の高速オート経営スキップを実行します...</strong>`);
            
            for (let i = 0; i < monthsToSkip; i++) {
                if (isGameOver) break;
                executeNextMonthLogic(true); // サイレントモードで実行
            }
            
            updateUI();
            saveData();
        }

        // 月次決算のコアロジック
        function executeNextMonthLogic(isSkipMode = false) {
            if (!isSkipMode) logAction(`--- 【${gameData.term}ヶ月目 月次決算報告】 ---`);
            
            let maxSales = gameData.ssales * 3;
            let salesCapacity = Math.ceil(maxSales * (gameData.marketing / 100));
            if (!isSkipMode) logAction(`[営業部] ブランド認知度(${gameData.marketing}%)により有効販売枠は ${salesCapacity} 個に制限されました`);

            // 製品の売却
            if (gameData.srocket > 0) {
                let sell = Math.min(gameData.srocket, salesCapacity); let p = Math.round(45000000 * gameData.mult_t);
                gameData.srocket -= sell; salesCapacity -= sell; gameData.cash += (p * sell);
                if(sell > 0 && !isSkipMode) logAction(`[営業] ロケットが ${sell} 機売却。売上: +${(p * sell).toLocaleString()}円`);
            }
            if (gameData.srobot > 0) {
                let sell = Math.min(gameData.srobot, salesCapacity); let p = Math.round(10000000 * gameData.mult_t);
                gameData.srobot -= sell; salesCapacity -= sell; gameData.cash += (p * sell);
                if(sell > 0 && !isSkipMode) logAction(`[営業] AIロボットが ${sell} 台売却。売上: +${(p * sell).toLocaleString()}円`);
            }
            if (gameData.scar > 0) {
                let sell = Math.min(gameData.scar, salesCapacity); let p = Math.round(2500000 * gameData.mult_c);
                gameData.scar -= sell; salesCapacity -= sell; gameData.cash += (p * sell);
                if(sell > 0 && !isSkipMode) logAction(`[営業] 電気自動車が ${sell} 台売却。売上: +${(p * sell).toLocaleString()}円`);
            }
            if (gameData.sphone > 0) {
                let sell = Math.min(gameData.sphone, salesCapacity); let p = Math.round(70000 * gameData.mult_c);
                gameData.sphone -= sell; salesCapacity -= sell; gameData.cash += (p * sell);
                if(sell > 0 && !isSkipMode) logAction(`[営業] スマホが ${sell} 台売却。売上: +${(p * sell).toLocaleString()}円`);
            }

            // 倉庫コスト
            let storageCost = (gameData.sphone * 5000) + (gameData.scar * 50000) + (gameData.srobot * 150000) + (gameData.srocket * 500000);
            if (storageCost > 0) {
                gameData.cash -= storageCost;
                if (!isSkipMode) logAction(`[倉庫] 在庫維持コスト: -${storageCost.toLocaleString()}円`);
            }

            // 固定費計算
            let totalExpenses = 150000 + (gameData.ssales * 150000) + (gameData.seng * 250000) + (gameData.ssci * 600000);
            gameData.cash -= totalExpenses;
            gameData.cash = gameData.cash - Math.round(gameData.loan * 0.005) + Math.round(gameData.deposit * 0.002);
            gameData.marketing = Math.max(5, gameData.marketing - 5);

            // 救済システム
            if (gameData.cash < 0 && gameData.deposit > 0) {
                let brokenDeposit = Math.min(gameData.deposit, Math.ceil(Math.abs(gameData.cash) / 1000000) * 1000000);
                gameData.deposit -= brokenDeposit; gameData.cash += brokenDeposit;
                if (!isSkipMode) logAction(`[警告] 資金ショート補填のため定期預金から ${brokenDeposit.toLocaleString()} 円を自動解約。`);
            }
            
            // 勝敗判定
            if (gameData.cash < 0) {
                alert(`🚨 【倒産】 ${gameData.term}ヶ月目に資金ショートしました。ゲームオーバーです。`);
                isGameOver = true;
                resetGame();
                return;
            }
            if (gameData.cash >= 100000000) {
                alert(`🎉 【クリア】 ${gameData.term}ヶ月目に目標の1億円を達成しました！経営の天才です！`);
                isGameOver = true;
                resetGame();
                return;
            }
            if (gameData.term >= 24) {
                alert("⏳ 【タイムアップ】 24ヶ月以内に1億円を達成できませんでした。ゲームオーバーです。");
                isGameOver = true;
                resetGame();
                return;
            }

            // 経済イベントの抽選
            let rand = Math.random();
            if (rand < 0.20) { gameData.news = "【バブル到来】ロボ・ロケ売価1.5倍！"; gameData.mult_c = 1.0; gameData.mult_t = 1.5; } 
            else if (rand < 0.40) { gameData.news = "【世界大不況】全売価が0.5倍に暴落！"; gameData.mult_c = 0.5; gameData.mult_t = 0.5; } 
            else { gameData.news = "市場は安定しています。"; gameData.mult_c = 1.0; gameData.mult_t = 1.0; }

            gameData.term++;
        }

        // 通常の「1ヶ月進む」ボタン用
        function nextMonth() {
            executeNextMonthLogic(false);
            updateUI();
            saveData();
        }
    </script>
</head>
