<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>統合経営システム - CEO室</title>
    <style>
        * { box-sizing: border-box !important; }
        body { background: #121214 !important; color: #e0e0e6 !important; font-family: monospace !important; padding: 20px !important; line-height: 1.6 !important; display: block !important; visibility: visible !important; }
        h1, h2, h3 { color: #00ff66 !important; border-bottom: 1px solid #333 !important; padding-bottom: 5px !important; margin-top: 15px !important; }
        .grid-container { display: block !important; width: 100% !important; margin-top: 20px !important; }
        .card { background: #1a1a24 !important; border: 1px solid #2d2d3d !important; padding: 15px !important; border-radius: 5px !important; margin-bottom: 20px !important; }
        .btn-group { margin-top: 15px !important; display: block !important; }
        .nav-btn { color: white !important; padding: 12px 20px !important; text-decoration: none !important; font-weight: bold !important; border-radius: 4px !important; display: inline-block !important; font-size: 14px !important; margin-right: 10px !important; margin-bottom: 10px !important; }
        .btn-bank { background: #3b82f6 !important; } .btn-business { background: #a855f7 !important; } .btn-hr { background: #eab308 !important; color: #000 !important; } .btn-marketing { background: #ec4899 !important; } .btn-rnd { background: #06b6d4 !important; }
        button.danger { background: #ef4444 !important; color: #fff !important; border: none !important; padding: 15px 30px !important; font-weight: bold !important; border-radius: 4px !important; cursor: pointer !important; font-size: 16px !important; width: 100% !important; display: block !important; }
        button.skip-btn { background: #10b981 !important; color: #fff !important; border: none !important; padding: 12px 18px !important; font-weight: bold !important; border-radius: 4px !important; cursor: pointer !important; font-size: 14px !important; margin-top: 10px !important; margin-right: 10px !important; display: inline-block !important; }
        .log-box { background: #000 !important; color: #00ff66 !important; padding: 10px !important; height: 180px !important; overflow-y: scroll !important; font-size: 13px !important; border: 1px solid #333 !important; margin-top: 10px !important; display: block !important; }
        .news-box { background: #ffea00 !important; color: #000 !important; padding: 12px !important; border-radius: 4px !important; font-weight: bold !important; margin-bottom: 20px !important; border-left: 5px solid #ffaa00 !important; font-size: 15px !important; }
        .mission-box { background: #1e3a8a !important; color: #fff !important; padding: 10px !important; border-radius: 4px !important; font-weight: bold !important; margin-bottom: 15px !important; border-left: 5px solid #3b82f6 !important; }
    </style>
    <script>
        let gameData, isGameOver = false;
        function loadData() {
            try {
                gameData = JSON.parse(localStorage.getItem('corp_game_data'));
                if (!gameData || !('tech_car' in gameData)) throw new Error();
            } catch (e) {
                gameData = { cash: 2000000, loan: 0, deposit: 0, sphone: 0, scar: 0, srobot: 0, srocket: 0, ssales: 1, seng: 0, ssci: 0, term: 1, news: "安定した経済環境です。各部門を開拓しましょう！", mult_c: 1.0, mult_t: 1.0, marketing: 20, tech_car: false, tech_robot: false, tech_rocket: false };
                saveData();
            }
        }
        function saveData() { localStorage.setItem('corp_game_data', JSON.stringify(gameData)); }
        function safeSet(id, val) { let el = document.getElementById(id); if (el) el.innerText = val; }
        function updateUI() {
            safeSet("lbl-term", gameData.term); safeSet("lbl-cash", gameData.cash.toLocaleString()); safeSet("lbl-loan", gameData.loan.toLocaleString()); safeSet("lbl-deposit", gameData.deposit.toLocaleString());
            safeSet("lbl-staff-sales", gameData.ssales); safeSet("lbl-staff-eng", gameData.seng); safeSet("lbl-staff-sci", gameData.ssci);
            safeSet("lbl-stock-phone", gameData.sphone); safeSet("lbl-stock-car", gameData.scar); safeSet("lbl-stock-robot", gameData.srobot); safeSet("lbl-stock-rocket", gameData.srocket);
            safeSet("lbl-marketing", gameData.marketing); safeSet("news-display", gameData.news);
        }
        function logAction(txt) { let b = document.getElementById("log"); if (b) { b.innerHTML += "<br>" + txt; b.scrollTop = b.scrollHeight; } }
        function resetGame() { localStorage.removeItem('corp_game_data'); window.location.reload(); }
        function initPage() { loadData(); updateUI(); }
        function skipMonths(m) {
            isGameOver = false; logAction(`🔮 <strong>【システム】 ${m}ヶ月の高速スキップを開始...</strong>`);
            for (let i = 0; i < m; i++) { if (isGameOver) break; executeNextMonthLogic(true); }
            updateUI(); saveData();
        }
        function nextMonth() { executeNextMonthLogic(false); updateUI(); saveData(); }
        function executeNextMonthLogic(isSkip = false) {
            if (!isSkip) logAction(`--- 【${gameData.term}ヶ月目 月次決算】 ---`);
            let cap = Math.ceil((gameData.ssales * 3) * (gameData.marketing / 100));
            if (!isSkip) logAction(`[営業部] 有効販売枠は ${cap} 個に制限されています`);
            let items = [
                { k: 'srocket', p: 45000000, m: 'mult_t', n: 'ロケット' }, { k: 'srobot', p: 10000000, m: 'mult_t', n: 'AIロボット' },
                { k: 'scar', p: 2500000, m: 'mult_c', n: '電気自動車' }, { k: 'sphone', p: 70000, m: 'mult_c', n: 'スマホ' }
            ];
            items.forEach(item => {
                if (gameData[item.k] > 0 && cap > 0) {
                    let s = Math.min(gameData[item.k], cap); let price = Math.round(item.p * gameData[item.m]);
                    gameData[item.k] -= s; cap -= s; gameData.cash += (price * s);
                    if (s > 0 && !isSkip) logAction(`[営業] ${item.n}が ${s} 個売却。売上: +${(price * s).toLocaleString()}円`);
                }
            });
            let store = (gameData.sphone * 5000) + (gameData.scar * 50000) + (gameData.srobot * 150000) + (gameData.srocket * 500000);
            if (store > 0) { gameData.cash -= store; if (!isSkip) logAction(`[倉庫] 維持コスト: -${store.toLocaleString()}円`); }
            let exp = 150000 + (gameData.ssales * 150000) + (gameData.seng * 250000) + (gameData.ssci * 600000);
            gameData.cash -= exp; gameData.cash = gameData.cash - Math.round(gameData.loan * 0.005) + Math.round(gameData.deposit * 0.002);
            gameData.marketing = Math.max(5, gameData.marketing - 5);
            if (gameData.cash < 0 && gameData.deposit > 0) {
                let brk = Math.min(gameData.deposit, Math.ceil(Math.abs(gameData.cash) / 1000000) * 1000000);
                gameData.deposit -= brk; gameData.cash += brk; if (!isSkip) logAction(`[財務] 補填のため定期預金から ${brk.toLocaleString()} 円を自動解約。`);
            }
            if (gameData.cash < 0) { alert(`🚨 【倒産】 ${gameData.term}ヶ月目に破産。`); isGameOver = true; resetGame(); return; }
            if (gameData.cash >= 100000000) { alert(`🎉 【クリア！】 ${gameData.term}ヶ月目に1億円達成！`); isGameOver = true; resetGame(); return; }
            if (gameData.term >= 24) { alert("⏳ 【タイムアップ】 24ヶ月終了。"); isGameOver = true; resetGame(); return; }
            let r = Math.random();
            if (r < 0.2) { gameData.news = "【バブル】ロボ・ロケ売価1.5倍！"; gameData.mult_c = 1.0; gameData.mult_t = 1.5; }
            else if (r < 0.4) { gameData.news = "【不況】全売価が0.5倍に暴落！"; gameData.mult_c = 0.5; gameData.mult_t = 0.5; }
            else { gameData.news = "市場は安定しています。"; gameData.mult_c = 1.0; gameData.mult_t = 1.0; }
            gameData.term++;
        }
    </script>
</head>
